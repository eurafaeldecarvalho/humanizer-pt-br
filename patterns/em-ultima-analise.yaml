id: em-ultima-analise
grupo: conectivo
nome: «Em última análise»
por_que: «Em primeira análise» e «em última análise» emprestam tom de parecer a um relato que não analisou nada. «Em última instância» tem uso jurídico real; a heurística não separa esse uso do enfeite, e isso está declarado aqui.
como_corrigir: Diga a conclusão como frase sua. «Em última análise, a linha 221 está curta» vira «a 221 está curta nesse horário».
exemplo_antes: Em última análise, a vírgula é o que separa o convite do almoço.
exemplo_depois: A vírgula separa o convite do almoço.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão em-ultima-analise, escrita para este repositório em 2026-10-29. Tema: vírgula que muda o sentido de uma frase. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\bem (?:primeira|última|ultima) análise\b
  - (?i)\bem última instância\b
  limite: Não distingue o uso jurídico de «em última instância».
