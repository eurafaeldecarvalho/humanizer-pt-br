id: titulo-title-case
grupo: formato
nome: Título com maiúsculas de inglês
por_que: 'Em inglês, o título capitaliza quase cada palavra. Em português, o título é frase: maiúscula na primeira palavra e nos nomes próprios. «Como Validar CPF Em Python Com Clareza» é o hábito do modelo, não o do manual brasileiro.'
como_corrigir: Deixe maiúscula só na primeira palavra e em nome, sigla e marca. «Como Validar CPF Em Python» vira «Como validar CPF em Python».
exemplo_antes: Como Validar CPF Em Python Com Clareza
exemplo_depois: Como validar CPF em Python
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão titulo-title-case, escrita para este repositório em 2026-10-29. Tema: título de README de uma biblioteca de CPF. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: title_case
  minimo: 1
  limite: Olha só linhas curtas sem ponto final. Não trata sigla no meio de uma frase.
