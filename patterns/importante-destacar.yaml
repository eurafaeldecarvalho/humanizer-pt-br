id: importante-destacar
grupo: conectivo
nome: «É importante destacar»
por_que: 'Parente de «vale ressaltar», com verbo de ênfase: «é importante destacar», «é fundamental ressaltar», «cabe salientar», «é imprescindível destacar». A ênfase ocupa o lugar do dado. Em ofício antigo a fórmula existe; em e-mail curto ela quase sempre é enchimento.'
como_corrigir: Fique com o dado. Se houver risco real, diga o risco («sem a baixa, o boleto continua em aberto»), não a palavra «importante».
exemplo_antes: É importante destacar que o protocolo 55219 está com a Marina, do financeiro.
exemplo_depois: O protocolo 55219 está com a Marina, do financeiro.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão importante-destacar, escrita para este repositório em 2026-10-29. Tema: protocolo de baixa de boleto. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\bé (?:importante|fundamental|essencial|imprescindível) (?:ressaltar|destacar|mencionar|salientar|sublinhar|notar)\b
  - (?i)\b(?:cabe|convém) (?:aqui )?(?:ressaltar|destacar|salientar|lembrar)\b
