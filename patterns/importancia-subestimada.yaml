id: importancia-subestimada
grupo: fechamento
nome: «Não pode ser subestimada»
por_que: «A importância de X não pode ser subestimada» e «não deve ser ignorada» gastam uma frase inteira para dizer que X importa, sem dizer o que acontece se alguém ignorar. É fechamento de parágrafo escolar e de release.
como_corrigir: Diga a consequência. «A importância da vírgula não pode ser subestimada» vira a frase em que a vírgula muda quem é chamado para o almoço.
exemplo_antes: 'A importância da vírgula não pode ser subestimada: sem ela, «vamos comer crianças» deixa de ser um chamado.'
exemplo_depois: Sem a vírgula, «vamos comer crianças» deixa de ser um chamado.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão importancia-subestimada, escrita para este repositório em 2026-10-29. Tema: vírgula que muda o sentido de uma frase. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\bnão (?:pode|deve) ser subestimad[oa]\b
  - (?i)\bnão (?:pode|deve) ser ignorad[oa]\b
