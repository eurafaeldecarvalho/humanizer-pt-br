id: nao-e-segredo
grupo: fechamento
nome: «Não é segredo que»
por_que: «Não é segredo que» e «não é novidade que» apresentam um fato comum como se fosse revelação. O fato em si pode ser útil; o prefácio não. Também aparece em coluna de jornal. A heurística não distingue.
como_corrigir: Diga o fato. Se ele for óbvio a ponto de não precisar estar no texto, corte o período inteiro, não só o prefácio.
exemplo_antes: Não é segredo que o time de DP tem 6 pessoas.
exemplo_depois: O time de DP tem 6 pessoas.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão nao-e-segredo, escrita para este repositório em 2026-10-29. Tema: tamanho de um time de DP. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\bnão é (?:segredo|novidade) que\b
  limite: Também aparece em texto humano. Não prova autoria.
