id: fechamento-em-suma
grupo: fechamento
nome: «Em suma» mecânico
por_que: «Em suma», «em conclusão», «em síntese» anunciam o fim como numa redação de vestibular. Em e-mail e recado, o último período já é o pedido («mando o arquivo às 10h»). O rótulo não acrescenta.
como_corrigir: Deixe o pedido ou o fato final sem rótulo. Se o texto for de fato um resumo escolar com tese, a última frase carrega a tese, ainda sem «em suma».
exemplo_antes: Em suma, o arquivo segue amanhã às 10h.
exemplo_depois: O arquivo segue amanhã às 10h.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão fechamento-em-suma, escrita para este repositório em 2026-10-29. Tema: horário de envio de um arquivo. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\b(?:em suma|em conclusão|em síntese|como conclusão)\b
