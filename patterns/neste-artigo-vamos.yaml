id: neste-artigo-vamos
grupo: abertura
nome: «Neste artigo vamos»
por_que: O texto anuncia o que vai fazer em vez de fazer. «Neste artigo, vamos explorar» e «ao longo deste guia» são moldura de blog. Um README ou uma nota de aula podem dizer o que o leitor encontra, em uma linha, sem prometer uma viagem.
como_corrigir: 'Substitua o anúncio pelo conteúdo. «Neste artigo vamos ver como validar CPF» vira a primeira instrução, ou uma frase: «A função confere o dígito; não consulta a Receita».'
exemplo_antes: Neste artigo, vamos explorar como conferir o dígito do CPF. Ao longo deste guia, o essencial aparece.
exemplo_depois: A função confere o dígito do CPF. Ela não consulta a Receita Federal.
origem:
  modelo: Grok 4.7
  data: '2026-10-29'
  prompt: 'Frase de exemplo do padrão neste-artigo-vamos, escrita para este repositório em 2026-10-29. Tema: função que confere dígito de CPF. Pedido: uma frase com cara de texto de modelo de linguagem em português do Brasil. Não copiar texto de terceiros.'
  reescrita: Reescrita no mesmo dia pelo mesmo modelo, aplicando src/processo.md e o catálogo.
  modelos_observados:
  - Grok 4.7
heuristica:
  tipo: regex
  padroes:
  - (?i)\bneste (?:artigo|post|guia|texto),? (?:vamos|você vai|abordaremos|exploraremos|veremos)\b
  - (?i)\bao longo deste (?:artigo|texto|guia|post)\b
